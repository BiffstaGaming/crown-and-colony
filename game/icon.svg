<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Crown & Colony app icon — ORIGINAL work, authored for this project (CC0 / project GPL v2).
       Motif: a heraldic crown above a colonial sailing ship on the sea, on the brand navy field.
       No original Sid Meier's Colonization art is used. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22507f"/>
      <stop offset="1" stop-color="#15314f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a6f97"/>
      <stop offset="1" stop-color="#184a63"/>
    </linearGradient>
  </defs>

  <!-- Rounded brand field -->
  <rect width="128" height="128" rx="20" fill="url(#sky)"/>

  <!-- Heraldic crown (gold) -->
  <g fill="#e9c46a" stroke="#b8923a" stroke-width="1.5" stroke-linejoin="round">
    <path d="M34 40 L34 24 L44 33 L54 20 L64 31 L74 20 L84 33 L94 24 L94 40 Z"/>
    <rect x="32" y="40" width="64" height="9" rx="2.5"/>
    <circle cx="34" cy="22" r="3.2"/>
    <circle cx="54" cy="18" r="3.2"/>
    <circle cx="64" cy="29" r="3.2"/>
    <circle cx="74" cy="18" r="3.2"/>
    <circle cx="94" cy="22" r="3.2"/>
  </g>
  <!-- Crown jewels -->
  <circle cx="48" cy="44.5" r="2.4" fill="#e76f51"/>
  <circle cx="64" cy="44.5" r="2.4" fill="#e76f51"/>
  <circle cx="80" cy="44.5" r="2.4" fill="#e76f51"/>

  <!-- Sea -->
  <path d="M0 96 Q32 88 64 96 T128 96 L128 128 L0 128 Z" fill="url(#sea)"/>

  <!-- Sailing ship (colony) -->
  <g>
    <!-- masts -->
    <rect x="51" y="60" width="2.5" height="38" fill="#6b4a2b"/>
    <rect x="74" y="60" width="2.5" height="38" fill="#6b4a2b"/>
    <!-- sails -->
    <path d="M52 62 Q40 72 40 86 L52 86 Z" fill="#f4f1de"/>
    <path d="M53.5 62 Q66 72 66 86 L53.5 86 Z" fill="#e8e3cc"/>
    <path d="M75 62 Q63 72 63 86 L75 86 Z" fill="#f4f1de"/>
    <path d="M76.5 62 Q88 72 88 86 L76.5 86 Z" fill="#e8e3cc"/>
    <!-- hull -->
    <path d="M36 88 L92 88 L84 102 L44 102 Z" fill="#7a5230" stroke="#5a3c22" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="40" y="92" width="48" height="3" fill="#9c6b3e"/>
  </g>
</svg>
