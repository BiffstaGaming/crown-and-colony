; Crown & Colony — Godot 4.6.3 (.NET) export presets.
;
; Three desktop presets for the release build: Windows, Linux, macOS. This file is
; safe to commit (it holds no secrets; passwords/keys live in .godot/export_credentials.cfg,
; which is gitignored). Edited by hand to match the Godot 4.6 export-preset schema; the
; editor will normalise/round-trip it on first open.
;
; Conventions (kept consistent across all three presets):
;   * export_path   = build/<platform>/Crown-and-Colony<ext>  (CI uploads from build/)
;   * binary_format/embed_pck = false — ship the .pck alongside the binary. For a .NET
;     (mono) project, embedding the PCK in the executable has historically been fragile
;     (the .NET assemblies/.cs content are packed separately); a side-by-side .pck is the
;     safe, well-trodden default. The release CI archives the whole platform folder, so the
;     loose .pck (and macOS .app/.zip) is bundled regardless.
;   * application/file_version + product_version = 0.1.0.0 / 0.1.0 — mirrors AppInfo.Version
;     (game/src/GameLogic/App/AppInfo.cs) and the <Version> in the csprojs. Bump together.
;   * Texture formats: S3TC + BPTC enabled (desktop GPUs); ETC/ETC2 off (mobile-only).
;
; NOTE: exporting actual binaries needs the Godot *export templates* for 4.6.3 installed
; (downloaded in the editor or `--install-export-templates` headless). They are NOT part of
; the repo; the release workflow installs them on CI. Without them `--export-release` fails
; with "No export template found".

[preset.0]

name="windows_desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/windows/Crown-and-Colony.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_encryption_key=""

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=false
texture_format/etc2=false
binary_format/architecture="x86_64"
codesign/enable=false
codesign/identity_type=0
codesign/identity=""
codesign/password=""
codesign/timestamp=true
codesign/timestamp_server_url=""
codesign/digest_algorithm=1
codesign/description=""
codesign/custom_options=PackedStringArray()
application/modify_resources=true
application/icon="res://icon.svg"
application/console_wrapper_icon="res://icon.svg"
application/icon_interpolation=4
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
application/company_name="Crown & Colony"
application/product_name="Crown & Colony"
application/file_description="Crown & Colony — a Colonization remake"
application/copyright="© The Crown & Colony contributors. GPL v2."
application/trademarks=""
ssh_remote_deploy/enabled=false

