# Per-nation colony (settlement) name lists.
# Format: model.nation.<id>.settlementName.classic.<index>=<Name>  (used in index order when founding).
# Embedded + parsed by Ruleset (FP-3a, ADR-018) so colony names are per-nation ruleset data.
#
# AUSTRALIAN FEDERATION reskin (86d3kwtrq): the primary British-Australian power (the `english` id — kept
# as the transposability anchor, ADR-018) founds Australian towns in historical order, Sydney first (the
# First Fleet, 1788). The `.classic.` infix is the FreeCol name-scheme selector and is unchanged.
# The optional sandbox powers (dutch/french/spanish, per doc 04) still carry their New-World names for now
# — reskinning those is a follow-up (they only appear in the multi-power sandbox mode).
