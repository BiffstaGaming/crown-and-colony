#
# The variant DEFAULT colony-name bucket (model.nation.default): the settlement names the NATION-LESS human
# founds by, in founding order (Ruleset.DefaultColonyNames → Game.ColonyNamesFor). The human has no nation id,
# so without this bucket it would fall back to the hard-coded American static list (Jamestown/Plymouth/…). Sydney
# first (the First Fleet, 1788). `.classic.` is the FreeCol name-scheme infix the parser expects (unchanged).
# Classic ships NO default bucket, so classic stays byte-identical (its hard-coded American fallback is used).
