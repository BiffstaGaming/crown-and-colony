name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      golden_update:
        description: "Regenerate the L4 golden PNGs on the CI Linux renderer and upload them as the goldens-linux artifact (for adoption/commit) instead of asserting against them."
        type: boolean
        default: false

jobs:
  logic-tests:
    name: "L1+L2: build & logic tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build solution (game + logic)
        run: dotnet build game/CrownAndColony.slnx --configuration Release

      - name: Build and run logic tests (L1 unit + L2 scenario)
        run: >
          dotnet test game/tests/GameLogic.Tests/GameLogic.Tests.csproj
          --configuration Release --filter "Category!=Soak"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=logic.trx"
          --results-directory TestResults

      # Publish the raw results so the QA-REPORT generator (and humans) can read
      # them. `always()` keeps the artifact even on a red run, for triage.
      - name: Upload logic test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-logic
          path: TestResults/logic.trx
          if-no-files-found: warn

  scene-tests:
    name: "L3: Godot interaction tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.6.3-mono-linux

      - name: Install Godot 4.6.3 (.NET)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_mono_linux_x86_64.zip
          mkdir -p ~/godot && unzip -q godot.zip -d ~/godot

      - name: Configure environment
        run: echo "GODOT_BIN=$HOME/godot/Godot_v4.6.3-stable_mono_linux_x86_64/Godot_v4.6.3-stable_mono_linux.x86_64" >> "$GITHUB_ENV"

      - name: Build solution
        run: dotnet build game/CrownAndColony.slnx

      - name: Import Godot project
        run: xvfb-run --auto-servernum "$GODOT_BIN" --path game --headless --import || true

      # Direct invocation with shell-level retry. Two distinct host-level flakes
      # are tolerated here — neither is a real test failure:
      #   1. Cold-runner socket connect ("Failed to connect: Connection
      #      timeout", exit 137) — the GdUnit Godot-runtime host occasionally
      #      can't reach its debug socket on a cold runner; a retry clears it.
      #   2. Leak-at-exit (kanban 86d3c7yk3): the GdUnit Godot host runs Godot's
      #      object/RID/texture leak detector when the *process* tears down.
      #      Godot's C# bindings finalize RefCounted resources (Texture2D, etc.)
      #      on the .NET GC *after* the engine main loop has already exited, and
      #      ISceneRunner.Load defaults to autoFree:false so loaded scenes are
      #      never freed either — so the detector prints "Texture … leaked /
      #      ObjectDB instances leaked at exit" and the process exits non-zero
      #      EVEN WHEN EVERY TEST PASSED. We therefore treat the TRX — not the
      #      process exit code — as the source of truth: an attempt is a real
      #      pass iff the TRX says tests ran with zero failed/errored. A genuine
      #      test failure still shows as failed>0 (or a missing TRX on a crash),
      #      so this masks ONLY the leak-at-exit warning, never a real failure.
      - name: Run scene tests (L3 + L4 goldens, up to 3 attempts)
        if: github.event.inputs.golden_update != 'true'
        working-directory: game
        run: |
          trx="TestResults/scene.trx"
          for attempt in 1 2 3; do
            rm -f "$trx"
            xvfb-run --auto-servernum dotnet test CrownAndColony.csproj --no-build --settings .runsettings \
                 --logger "console;verbosity=normal" \
                 --logger "trx;LogFileName=scene.trx" --results-directory TestResults
            code=$?

            if [ "$code" -eq 0 ]; then
              exit 0   # clean process exit + tests passed
            fi

            # Non-zero exit: consult the TRX to tell a leak-at-exit (tests all
            # passed, ignore) apart from a real failure / crash (no TRX or failed>0).
            if [ -f "$trx" ]; then
              counters=$(grep -oE '<Counters[^/]*/>' "$trx" | head -n1)
              total=$(printf '%s' "$counters" | grep -oE 'total="[0-9]+"' | grep -oE '[0-9]+')
              failed=$(printf '%s' "$counters" | grep -oE 'failed="[0-9]+"' | grep -oE '[0-9]+')
              errored=$(printf '%s' "$counters" | grep -oE 'error="[0-9]+"' | grep -oE '[0-9]+')
              total=${total:-0}; failed=${failed:-0}; errored=${errored:-0}
              if [ "$total" -gt 0 ] && [ "$failed" -eq 0 ] && [ "$errored" -eq 0 ]; then
                echo "::warning::Scene tests all passed (total=$total) but the Godot host exited $code at teardown (leak-at-exit, kanban 86d3c7yk3) — treating as pass."
                exit 0
              fi
              echo "::warning::Scene-test attempt $attempt had real failures (failed=$failed error=$errored total=$total); retrying"
            else
              echo "::warning::Scene-test attempt $attempt produced no TRX (host crash / connect timeout, exit $code); retrying"
            fi
          done
          echo "::error::Scene tests failed after 3 attempts (real test failures or host could not start)."
          exit 1

      # Golden regeneration path (workflow_dispatch with golden_update=true): render every L4 golden on THIS Linux
      # runner with GOLDEN_UPDATE=1 (GoldenAssert saves the PNG and returns instead of asserting), then upload the whole
      # goldens dir as an artifact for adoption. The process exit code is ignored (leak-at-exit + a golden that has no
      # baseline both exit non-zero even though every PNG was written). See kanban 86d3f69e9.
      - name: Regenerate L4 goldens on CI Linux (GOLDEN_UPDATE)
        if: github.event.inputs.golden_update == 'true'
        working-directory: game
        run: |
          GOLDEN_UPDATE=1 xvfb-run --auto-servernum dotnet test CrownAndColony.csproj \
            --no-build --settings .runsettings --logger "console;verbosity=normal" || true
          echo "Regenerated goldens:"; ls -la tests/visual/goldens/

      - name: Upload regenerated goldens (goldens-linux)
        if: github.event.inputs.golden_update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: goldens-linux
          path: game/tests/visual/goldens/
          if-no-files-found: error

      # Publish the L3/L4 results so the QA-REPORT generator can read them.
      - name: Upload scene test results (TRX)
        if: always() && github.event.inputs.golden_update != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trx-scene
          path: game/TestResults/scene.trx
          if-no-files-found: warn

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: game/TestResults/visual/
          if-no-files-found: ignore
