name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  logic-tests:
    name: "L1+L2: build & logic tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build game/CrownAndColony.slnx --configuration Release

      - name: Run logic tests (L1 unit + L2 scenario)
        run: >
          dotnet test game/tests/GameLogic.Tests/GameLogic.Tests.csproj
          --configuration Release --no-build --logger "console;verbosity=normal"

  scene-tests:
    name: "L3: Godot interaction tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run GdUnit4 scene tests in Godot runtime (L3 + L4 goldens)
        uses: MikeSchulze/gdUnit4-action@v1
        with:
          godot-version: "4.6.3"
          godot-net: true
          dotnet-version: net8.0
          version: latest
          project_dir: "./game/"
          paths: "presentation/tests"
          publish-report: false
          # Godot-runtime startup on cold runners occasionally times out
          # (exit 137, "Failed to connect") — one retry absorbs the flake.
          retries: 1

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: game/TestResults/visual/
          if-no-files-found: ignore
