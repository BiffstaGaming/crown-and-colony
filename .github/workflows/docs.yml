name: Docs site

# Builds the player-guide website (MkDocs Material) from docs/guide and, when you choose,
# publishes it to GitHub Pages.
#
#   • The `build` job runs on every push/PR that touches the guide — it validates that the
#     site builds cleanly (mkdocs --strict). Nothing is published.
#   • The `deploy` job publishes to GitHub Pages. It runs ONLY when you trigger it manually
#     (Actions → "Docs site" → Run workflow), so the site never goes live until you say so.
#
# BEFORE the first deploy: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# To auto-publish on every push to main instead, change the deploy `if:` line to:
#   if: github.event_name == 'push' && github.ref == 'refs/heads/main'

on:
  push:
    branches: [main]
    paths:
      - 'docs/guide/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/guide/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
