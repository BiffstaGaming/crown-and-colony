name: Release

# Builds the three desktop exports (Windows / Linux / macOS) and publishes them to a
# GitHub Release. Triggered by pushing a semver tag (vX.Y.Z) — the conventional release
# gesture — or manually via the Actions tab (workflow_dispatch) for a dry run.
#
# Godot install + .NET SDK steps mirror ci.yml's scene-tests job (same 4.6.3 .NET build,
# same cache). The extra piece here is installing the matching *export templates*, which
# CI's test jobs don't need but exporting binaries does.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

# Needed to create/update the GitHub Release and upload assets to it.
permissions:
  contents: write

jobs:
  export:
    name: "Export desktop binaries + publish release"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # --- Godot 4.6.3 (.NET) + export templates --------------------------------
      # Same editor binary as ci.yml's scene-tests job; we additionally fetch the
      # export-template pack and drop it where Godot looks for it.
      - name: Cache Godot + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-4.6.3-mono-linux-export

      - name: Install Godot 4.6.3 (.NET) + export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          # Editor (headless export host)
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_mono_linux_x86_64.zip
          mkdir -p ~/godot && unzip -q godot.zip -d ~/godot
          # Export templates (.NET / mono pack) for this exact version.
          curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_mono_export_templates.tpz
          unzip -q templates.tpz -d templates-extract
          # The .tpz extracts to a "templates/" dir; Godot expects it under
          # <data>/export_templates/<dir>, where <dir> is the version with DOTS and a
          # ".stable.mono" suffix for .NET builds — e.g. "4.6.3.stable.mono" (NOT the
          # "4.6.3-stable" tag form). Verified locally: the editor looks for
          # export_templates/4.6.3.stable.mono/windows_release_x86_64.exe etc.
          tpl_dir="4.6.3.stable.mono"
          mkdir -p "$HOME/.local/share/godot/export_templates/${tpl_dir}"
          cp -r templates-extract/templates/. "$HOME/.local/share/godot/export_templates/${tpl_dir}/"

      - name: Configure environment
        run: echo "GODOT_BIN=$HOME/godot/Godot_v4.6.3-stable_mono_linux_x86_64/Godot_v4.6.3-stable_mono_linux.x86_64" >> "$GITHUB_ENV"

      # --- Build (must succeed before export packs the assemblies) --------------
      - name: Build solution (Release)
        run: dotnet build game/CrownAndColony.slnx --configuration Release

      # --- Resolve the version string -------------------------------------------
      # A tag push gives v0.1.0 -> 0.1.0; a manual run reads <Version> from the
      # GameLogic csproj (the same source AppInfo.Version compiles in) so the two
      # never drift.
      - name: Resolve release version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver=$(grep -oE '<Version>[^<]+</Version>' game/src/GameLogic/GameLogic.csproj | head -n1 | sed -E 's/<\/?Version>//g')
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Release version: $ver"

      # --- Import once, then export each preset ---------------------------------
      - name: Import Godot project
        run: xvfb-run --auto-servernum "$GODOT_BIN" --path game --headless --import || true

      - name: Export Windows
        working-directory: game
        run: |
          mkdir -p build/windows
          xvfb-run --auto-servernum "$GODOT_BIN" --headless --export-release "windows_desktop" build/windows/Crown-and-Colony.exe

      - name: Export Linux
        working-directory: game
        run: |
          mkdir -p build/linux
          xvfb-run --auto-servernum "$GODOT_BIN" --headless --export-release "linuxbsd" build/linux/Crown-and-Colony.x86_64

      - name: Export macOS
        working-directory: game
        run: |
          mkdir -p build/macos
          xvfb-run --auto-servernum "$GODOT_BIN" --headless --export-release "macos" build/macos/Crown-and-Colony.zip

      # --- Package per-platform zips, version-stamped ---------------------------
      - name: Package version-stamped archives
        id: package
        working-directory: game
        run: |
          ver="${{ steps.version.outputs.version }}"
          mkdir -p dist
          # Windows: zip the whole folder (exe + .pck + console wrapper + .NET assemblies).
          (cd build/windows && zip -qr "../../dist/Crown-and-Colony-${ver}-windows.zip" .)
          # Linux: same — binary + .pck + assemblies.
          (cd build/linux && zip -qr "../../dist/Crown-and-Colony-${ver}-linux.zip" .)
          # macOS export is already a .zip (a zipped .app); just rename it in place.
          cp build/macos/Crown-and-Colony.zip "dist/Crown-and-Colony-${ver}-macos.zip"
          echo "dir=game/dist" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crown-and-colony-${{ steps.version.outputs.version }}
          path: game/dist/*.zip
          if-no-files-found: error

      # --- Publish the GitHub Release (tag pushes only) -------------------------
      # On workflow_dispatch there is no tag, so we skip the Release step but still
      # leave the artifacts attached to the workflow run (above) for inspection.
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: "Crown & Colony ${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: game/dist/*.zip
